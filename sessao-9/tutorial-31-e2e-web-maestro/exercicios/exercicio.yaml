# Exercício — complete e endureça este fluxo de checkout no saucedemo.
#
# Objetivo: entrar, adicionar a mochila (Sauce Labs Backpack) ao carrinho,
# abrir o carrinho, concluir o checkout preenchendo o formulário e confirmar
# que o pedido foi finalizado ("Thank you for your order!").
#
# Como está, o fluxo tem os problemas de sempre: repete o login em vez de
# reusar o subflow, toca por coordenada, não espera as telas e não confirma
# nenhum resultado. Além disso, ele para no meio — não chega ao checkout.
#
# Sua tarefa:
#   1. Troque o login copiado por `runFlow` do subflow login.yaml.
#   2. Troque as coordenadas por ids estáveis.
#   3. Complete o checkout: abrir o carrinho, tocar em "Checkout" (id: checkout),
#      preencher first-name / last-name / postal-code, "Continue" (id: continue)
#      e "Finish" (id: finish).
#   4. Confirme o resultado com uma assertion do texto "Thank you for your order!".
# Descubra o seletor do link do carrinho com `maestro studio`. Compare com gabarito.yaml.
url: "https://www.saucedemo.com"   # alvo web: Maestro estável 2.x usa url: (não appId:)
---
- launchApp

# ❌ login copiado em vez de reusar login.yaml
- tapOn:
    id: "user-name"
- inputText: "standard_user"
- tapOn:
    id: "password"
- inputText: "secret_sauce"
- tapOn:
    id: "login-button"

# ❌ coordenada em vez de id
- tapOn:
    point: "90%, 45%"

# ❌ para aqui: não abre o carrinho, não faz o checkout, não confirma nada
