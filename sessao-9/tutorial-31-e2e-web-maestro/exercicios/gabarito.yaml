# Gabarito — compra robusta no saucedemo, exercitando os recursos do guia:
# login reaproveitado (runFlow + env), espera por condição (extendedWaitUntil),
# rolagem até o produto (scrollUntilVisible), asserção de estado derivado na
# adição e na remoção (assertVisible / assertNotVisible) e o checkout completo.
# Executar: maestro test gabarito.yaml
url: "https://www.saucedemo.com"   # alvo web: Maestro estável 2.x usa url: (não appId:)
---
# Login como subflow parametrizado, não copiado.
- runFlow:
    file: login.yaml
    env:
      USUARIO: standard_user

# Espera explícita até o catálogo carregar.
- extendedWaitUntil:
    visible:
      id: "inventory_container"
    timeout: 10000

# Adiciona a mochila (topo da lista) e confirma pelo estado derivado.
- tapOn:
    id: "add-to-cart-sauce-labs-backpack"
- assertVisible:
    id: "remove-sauce-labs-backpack"

# Segundo produto, mais abaixo: rola até ele antes de tocar.
- scrollUntilVisible:
    element:
      id: "add-to-cart-sauce-labs-fleece-jacket"
    direction: DOWN
- tapOn:
    id: "add-to-cart-sauce-labs-fleece-jacket"
- assertVisible:
    id: "remove-sauce-labs-fleece-jacket"

# Abre o carrinho e confirma os dois itens pelo nome.
- tapOn:
    id: "shopping_cart_container"
- assertVisible: "Sauce Labs Backpack"
- assertVisible: "Sauce Labs Fleece Jacket"

# Remove um item e confirma pelo estado derivado que ele saiu (assertNotVisible),
# e que o outro permaneceu — verificar o efeito da ação, não só o clique.
- tapOn:
    id: "remove-sauce-labs-fleece-jacket"
- assertNotVisible: "Sauce Labs Fleece Jacket"
- assertVisible: "Sauce Labs Backpack"

# Checkout do item restante: formulário, revisão e finalização.
- tapOn:
    id: "checkout"
- tapOn:
    id: "first-name"
- inputText: "Ana"
- tapOn:
    id: "last-name"
- inputText: "Souza"
- tapOn:
    id: "postal-code"
- inputText: "31000-000"
- tapOn:
    id: "continue"
- assertVisible:
    id: "finish"
- tapOn:
    id: "finish"

# Confirma o resultado final e volta ao catálogo.
- assertVisible: "Thank you for your order!"
- tapOn:
    id: "back-to-products"
- assertVisible:
    id: "inventory_container"
