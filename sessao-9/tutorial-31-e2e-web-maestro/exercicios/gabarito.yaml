# Gabarito — checkout completo no saucedemo, com login reaproveitado,
# seletores estáveis e uma assertion depois de cada etapa relevante.
# Executar: maestro test gabarito.yaml
appId: "https://www.saucedemo.com"
---
# Login como subflow, não copiado.
- runFlow:
    file: login.yaml
    env:
      USUARIO: standard_user

# Adiciona a mochila e confirma pelo estado derivado (botão vira "Remove").
- tapOn:
    id: "add-to-cart-sauce-labs-backpack"
- assertVisible:
    id: "remove-sauce-labs-backpack"

# Abre o carrinho. O container do carrinho tem id estável no saucedemo;
# confirme o seletor exato com `maestro studio` no seu ambiente.
- tapOn:
    id: "shopping_cart_container"
- assertVisible:
    id: "checkout"

# Checkout: formulário de dados e finalização, tudo por id.
- tapOn:
    id: "checkout"
- tapOn:
    id: "first-name"
- inputText: "Ana"
- tapOn:
    id: "last-name"
- inputText: "Souza"
- tapOn:
    id: "postal-code"
- inputText: "31000-000"
- tapOn:
    id: "continue"
- tapOn:
    id: "finish"

# Confirma o resultado final pelo texto da tela de sucesso.
- assertVisible: "Thank you for your order!"
