<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checkout — Loja Exemplo</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  .produto { display: flex; justify-content: space-between; align-items: center; border: 1px solid #ccc; padding: 12px; border-radius: 6px; }
  button { padding: 8px 16px; cursor: pointer; }
  #carrinho { margin-top: 24px; border-top: 1px solid #ccc; padding-top: 16px; }
  #confirmacao { display: none; margin-top: 24px; padding: 12px; background: #e6ffe6; border: 1px solid #2a2; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Checkout</h1>

  <div class="produto" id="produto-livro" data-testid="produto-livro">
    <span>Livro — R$ 30,00</span>
    <button id="adicionar" data-testid="adicionar">Adicionar</button>
  </div>

  <div id="carrinho">
    <p id="carrinho-total" data-testid="carrinho-total">Total: R$ 0,00</p>
    <button id="finalizar" data-testid="finalizar">Finalizar</button>
  </div>

  <div id="confirmacao" data-testid="confirmacao">
    Pedido confirmado
  </div>

  <script>
    var PRECO_LIVRO = 30.0;
    var totalCentavos = 0;

    function formatarReais(valor) {
      return "R$ " + valor.toFixed(2).replace(".", ",");
    }

    document.getElementById("adicionar").addEventListener("click", function () {
      totalCentavos += PRECO_LIVRO;
      document.getElementById("carrinho-total").textContent =
        "Total: " + formatarReais(totalCentavos);
    });

    document.getElementById("finalizar").addEventListener("click", function () {
      if (totalCentavos > 0) {
        document.getElementById("confirmacao").style.display = "block";
      }
    });
  </script>
</body>
</html>
