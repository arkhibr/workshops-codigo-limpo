# Fluxo frágil — mesmo objetivo de fluxo_bons.yaml (entrar e adicionar dois
# produtos no saucedemo), com os anti-padrões mais comuns em E2E web.
# Executar: maestro test fluxo_ruins.yaml
appId: "https://www.saucedemo.com"
---
- launchApp

# ❌ Anti-padrão 1: login copiado e colado, em vez de um subflow reutilizável.
# A mesma sequência vai se repetir em todos os fluxos da suíte; no dia em que
# a tela de login mudar, será preciso corrigir arquivo por arquivo.
- tapOn:
    id: "user-name"
- inputText: "standard_user"
- tapOn:
    id: "password"
- inputText: "secret_sauce"
- tapOn:
    id: "login-button"

# ❌ Anti-padrão 2: tapOn por coordenada, em vez de id/texto.
# "90%, 45%" só acerta o botão de um produto na resolução exata em que alguém
# mediu o ponto. Muda o tamanho da janela e o toque cai em outro lugar.
- tapOn:
    point: "90%, 45%"

# ❌ Anti-padrão 3: assume que o segundo produto já está visível, sem rolar.
# Em uma tela menor, o item fica fora da viewport e o toque por coordenada erra.
- tapOn:
    point: "90%, 70%"

# ❌ Anti-padrão 4: o fluxo termina sem nenhuma assertion. Se nada tiver entrado
# no carrinho, ninguém fica sabendo — ele "passa" por ter executado os toques.
