# Fluxo frágil — mesmo objetivo do fluxo_bons.yaml (entrar, adicionar produtos e
# "fechar" a compra no saucedemo), com os anti-padrões mais comuns em E2E web.
# Ele roda e termina em verde — e é justamente esse o problema: passa sem provar
# nada. Compare, passo a passo, com o fluxo_bons.yaml.
# Executar: maestro test fluxo_ruins.yaml
url: "https://www.saucedemo.com"   # alvo web: Maestro estável 2.x usa url: (não appId:)
---
# ❌ Anti-padrão 1 (idempotência): launchApp sem clearState. O fluxo herda a
# sessão e o carrinho de uma execução anterior — o resultado passa a depender do
# que sobrou, não do que o fluxo faz.
- launchApp

# ❌ Anti-padrão 2 (reuso): login copiado e colado, em vez do subflow login.yaml.
# A mesma sequência vai se repetir em todos os fluxos da suíte; no dia em que a
# tela de login mudar, será preciso corrigir arquivo por arquivo.
- tapOn:
    id: "user-name"
- inputText: "standard_user"
- tapOn:
    id: "password"
- inputText: "secret_sauce"
- tapOn:
    id: "login-button"

# ❌ Anti-padrão 3 (seletor frágil): tapOn por coordenada, em vez de id/texto.
# "90%, 45%" só acerta o botão de um produto na resolução exata em que alguém
# mediu o ponto. Muda o tamanho da janela e o toque cai em outro lugar — sem erro.
- tapOn:
    point: "90%, 45%"

# ❌ Anti-padrão 4 (fora da viewport): assume que o segundo produto já está
# visível, sem scrollUntilVisible. Numa tela menor, o item fica fora da tela e o
# toque por coordenada erra o alvo.
- tapOn:
    point: "90%, 70%"

# ❌ Anti-padrão 5 (sem espera por condição): vai direto ao carrinho por
# coordenada, sem assertVisible/extendedWaitUntil que garanta que a tela chegou.
- tapOn:
    point: "95%, 8%"

# ❌ Anti-padrão 6 (sem verificação): o fluxo termina aqui, sem nenhuma assertion.
# Se nada tiver entrado no carrinho, ninguém fica sabendo — ele "passa" por ter
# executado os toques, não por ter comprado alguma coisa.
