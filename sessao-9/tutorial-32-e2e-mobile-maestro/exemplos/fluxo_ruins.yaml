# Fluxo mobile frágil — mesmo objetivo de fluxo_bons.yaml (entrar e adicionar
# um produto no Sauce Labs My Demo App), com os anti-padrões típicos de E2E mobile.
# Executar: maestro test fluxo_ruins.yaml
appId: com.saucelabs.mydemoapp.rn
---
# ❌ Anti-padrão 1: launchApp sem clearState.
# O app guarda a sessão entre aberturas — quem rodou o fluxo antes continua
# logado. Este fluxo pula o login presumindo essa sessão. Passa na segunda
# execução (quando já há sessão) e falha na primeira, numa máquina limpa ou
# logo após reinstalar o app. O resultado depende do que ficou para trás.
- launchApp

# ❌ Anti-padrão 2: toca por coordenada, presumindo que o catálogo já está na
# tela e que o produto está nessa posição — some em telas de tamanho diferente.
- tapOn:
    point: "50%, 40%"

# ❌ Anti-padrão 3: assume o produto visível sem rolar a lista.
- tapOn:
    point: "85%, 90%"

# ❌ Anti-padrão 4: o fluxo termina sem nenhuma assertion. Se o item não entrou
# no carrinho, ninguém fica sabendo — ele "passa" por ter executado os toques.
