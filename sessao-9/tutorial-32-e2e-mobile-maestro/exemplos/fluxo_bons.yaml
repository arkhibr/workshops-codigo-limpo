# Fluxo mobile robusto — entra no Sauce Labs My Demo App, encontra um produto
# na lista rolável e o adiciona ao carrinho, confirmando pelo estado da tela.
# Requer emulador/simulador com o app instalado. Executar: maestro test fluxo_bons.yaml
appId: com.saucelabs.mydemoapp.rn
---
# Login reaproveitado como subflow, não copiado.
- runFlow:
    file: login.yaml
    env:
      USUARIO: "bob@example.com"

# A lista de produtos é rolável: role até o produto antes de tocar, em vez de
# supor que ele já está na tela (o que depende do tamanho do aparelho).
- scrollUntilVisible:
    element:
      text: "Sauce Labs Backpack"
    direction: DOWN
- tapOn: "Sauce Labs Backpack"

# Na tela do produto, adiciona ao carrinho.
- tapOn: "Add To Cart"
# Estado derivado: o botão troca de "Add To Cart" para "Remove Item".
# Verificar a troca prova que o item entrou, e não apenas que houve um toque.
- assertVisible: "Remove Item"
