# Subflow de login reutilizável no Sauce Labs My Demo App (mobile).
#
# Trecho chamado por outros fluxos com `runFlow`, para não repetir o login em
# cada arquivo. Recebe o usuário por parâmetro (env). Neste app React Native os
# elementos são identificados por rótulo de acessibilidade (não por resource-id),
# então os seletores são textos — confirme-os com `maestro studio` no seu ambiente.
appId: com.saucelabs.mydemoapp.rn
env:
  USUARIO: "bob@example.com"
---
- launchApp:
    clearState: true          # começa deslogado a cada execução
- tapOn: "open menu"
- tapOn: "Log In"
- tapOn: "Username input field"
- inputText: "${USUARIO}"
- tapOn: "Password input field"
- inputText: "10203040"
- hideKeyboard               # fecha o teclado antes de tocar no botão
- tapOn: "Login button"
- assertVisible: "Products"   # confirma que o login levou ao catálogo
