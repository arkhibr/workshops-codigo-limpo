# Subflow de login no Sauce Labs My Demo App (cópia local do exercício).
#
# Idêntico a exemplos/login.yaml. Replicado aqui porque o gabarito.yaml o chama
# com `runFlow: file: login.yaml`, e o caminho é resolvido a partir da pasta do
# fluxo que chama. Neste app React Native os elementos são identificados por
# rótulo de acessibilidade (texto), não por resource-id.
appId: com.saucelabs.mydemoapp.rn
env:
  USUARIO: "bob@example.com"
---
- launchApp:
    clearState: true
- tapOn: "open menu"
- tapOn: "Log In"
- tapOn: "Username input field"
- inputText: "${USUARIO}"
- tapOn: "Password input field"
- inputText: "10203040"
- hideKeyboard
- tapOn: "Login button"
- assertVisible: "Products"
