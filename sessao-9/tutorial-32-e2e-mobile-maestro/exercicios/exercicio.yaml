# Exercício — complete e torne hermético este fluxo mobile no Sauce Labs My Demo App.
#
# Objetivo: começar do zero, fazer login, encontrar o "Sauce Labs Backpack" na
# lista rolável e adicioná-lo ao carrinho, confirmando pelo estado da tela.
#
# Como está, o fluxo não reinicia o estado (presume uma sessão anterior), toca
# por coordenada, não rola a lista e não confirma nada.
#
# Sua tarefa:
#   1. Comece do zero: troque o login copiado/ausente por `runFlow` de login.yaml
#      (com clearState, que já está no subflow).
#   2. Role até o produto com `scrollUntilVisible` e toque nele por texto.
#   3. Adicione ao carrinho e confirme pelo estado derivado ("Remove Item").
# Descubra os seletores exatos com `maestro studio`. Compare com gabarito.yaml.
appId: com.saucelabs.mydemoapp.rn
---
# ❌ abre o app sem limpar o estado — conta com uma sessão anterior
- launchApp

# ❌ coordenada, presumindo que o catálogo já está aberto
- tapOn:
    point: "50%, 40%"

# ❌ coordenada para adicionar ao carrinho, sem rolar a lista
- tapOn:
    point: "85%, 90%"

# ❌ termina sem confirmar que o item entrou no carrinho
