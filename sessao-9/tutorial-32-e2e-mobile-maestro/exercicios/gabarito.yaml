# Gabarito — mesmo objetivo de exercicio.yaml, agora começando do zero, com o
# login reaproveitado como subflow, rolagem até o produto e assertion de estado.
# Executar: maestro test gabarito.yaml
appId: com.saucelabs.mydemoapp.rn
---
# ✅ login como subflow (já inclui clearState), não copiado
- runFlow:
    file: login.yaml
    env:
      USUARIO: "bob@example.com"

# ✅ rola a lista até o produto, em vez de supor sua posição
- scrollUntilVisible:
    element:
      text: "Sauce Labs Backpack"
    direction: DOWN
- tapOn: "Sauce Labs Backpack"

# ✅ adiciona ao carrinho e confirma pelo estado derivado
- tapOn: "Add To Cart"
- assertVisible: "Remove Item"
